# DOCUMENTED EXAMPLE ONLY — copy this file to .github/workflows/llm-scan.yml yourself.
# It is kept in docs/ (not .github/workflows/) in the first push so the
# initial push does not require a token with workflow scope.
name: LLM security scan
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install .
          llm-scan scan . --format sarif > report.sarif || echo "GATE_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
      - name: Fail on gate failure
        if: env.GATE_FAILED == '1'
        run: exit 1
